site_name: Tessero
site_description: Numerical computing for PHP — arrays, linear algebra, FFT, random numbers, sparse matrices, optimisation, LP/MILP and MDP solvers on a native kernel.
copyright: Copyright &copy; 2026 The Tessero contributors — BSD-3-Clause
docs_dir: docs
exclude_docs: |
  project/_generated/
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  nav:
    omitted_files: info   # generated API pages are reached from reference/api/index.md
    not_found: warn
  links:
    not_found: warn
    anchors: warn

