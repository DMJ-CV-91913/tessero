      z: [0.5, 1.0, 2.0, 5.0, 10.0]
      derivative: [0, 1]
    impl: "o[0] = i[2] != 0.0 ? xsf::sph_bessel_j_jac((long)i[0], i[1]) : xsf::sph_bessel_j((long)i[0], i[1]);"
    doc: "Spherical Bessel function of the first kind, or its derivative (scipy.special.spherical_jn)."
