    impl: "o[0] = wright::wrightomega_real(i[0]);"
    doc: "Wright Omega function."
  - name: xlog1py
    ref: scipy.special.xlog1py
    args: [x, y]
    outs: [z]
    impl: "o[0] = xsf::xlog1py(i[0], i[1]);"
    doc: "Compute ``x*log1p(y)`` so that the result is 0 if ``x = 0``."
  - name: xlogy
    ref: scipy.special.xlogy
    args: [x, y]
    outs: [z]
    impl: "o[0] = xsf::xlogy(i[0], i[1]);"
    doc: "Compute ``x*log(y)`` so that the result is 0 if ``x = 0``."
  - name: y0
    ref: scipy.special.y0
    args: [x]
    outs: [Y]
    impl: "o[0] = xsf::cyl_bessel_y0(i[0]);"
    doc: "Bessel function of the second kind of order 0."
  - name: y1
    ref: scipy.special.y1
    args: [x]
    outs: [Y]
    impl: "o[0] = xsf::cyl_bessel_y1(i[0]);"
    doc: "Bessel function of the second kind of order 1."
  - name: yn
    ref: scipy.special.yn
    args: [n, x]
    outs: [Y]
    impl: "o[0] = scipy_port::yn_unsafe(i[0], i[1]);"
    int_impl: "o[0] = scipy_xsfw::cephes_yn_wrap((long)i[0], i[1]);"
    int_args: [0]
    doc: "Bessel function of the second kind of integer order and real argument."
  - name: yv
    ref: scipy.special.yv
    args: [v, z]
    outs: [Y]
    impl: "o[0] = xsf::cyl_bessel_y(i[0], i[1]);"
    cplx_impl: "std::complex<double> r = xsf::cyl_bessel_y(i[0], std::complex<double>(i[2], i[3])); o[0] = r.real(); o[1] = r.imag();"
    doc: "Bessel function of the second kind of real order and complex argument."
  - name: yve
    ref: scipy.special.yve
    args: [v, z]
    outs: [Y]
    impl: "o[0] = xsf::cyl_bessel_ye(i[0], i[1]);"
    doc: "Exponentially scaled Bessel function of the second kind of real order."
  - name: zetac
    ref: scipy.special.zetac
    args: [x]
    outs: [y]
    impl: "o[0] = xsf::zetac(i[0]);"
    doc: "Riemann zeta function minus 1."
  - name: softplus
    ref: scipy.special.softplus
    args: [x]
    outs: [y]
    impl: "o[0] = fmax(i[0], 0.0) + log1p(exp(-fabs(i[0])));"
    doc: "Softplus, log(1 + exp(x)), evaluated stably (scipy.special.softplus)."
  - name: sinc
    ref: scipy.special.sinc
    args: [x]
    outs: [y]
    impl: "double px = 3.141592653589793 * i[0]; o[0] = px == 0.0 ? 1.0 : sin(px) / px;"
    doc: "Normalized sinc, sin(pi x)/(pi x) with sinc(0)=1 (scipy.special.sinc)."
