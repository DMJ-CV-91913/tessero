  - name: comb
    ref: scipy.special.comb
    args: [N, k]
    outs: [y]
    impl: "o[0] = (i[1] <= i[0] && i[0] >= 0.0 && i[1] >= 0.0) ? xsf::binom(i[0], i[1]) : 0.0;"
    doc: "The number of combinations of N things taken k at a time (scipy.special.comb, exact=False, repetition=False)."
  - name: factorial
    ref: scipy.special.factorial
    args: [n]
    outs: [y]
    impl: "o[0] = (i[0] < 0.0) ? 0.0 : xsf::gamma(i[0] + 1.0);"
    doc: "The factorial n! as gamma(n+1), 0 for n<0 (scipy.special.factorial, exact=False)."
  - name: polygamma
    ref: scipy.special.polygamma
    args: [n, x]
    outs: [y]
    domain:
      n: [0, 1, 2, 3, 4, 5]
      x: [0.1, 0.5, 1.0, 1.5, 2.5, 5.0, 10.0, 50.0]
    impl: "int nn = (int)(i[0] + 0.5); o[0] = nn == 0 ? xsf::digamma(i[1]) : ((nn & 1 ? 1.0 : -1.0) * xsf::gamma((double)nn + 1.0) * xsf::zeta((double)nn + 1.0, i[1]));"
    doc: "Polygamma function of order n: the (n+1)-th derivative of the logarithm of the gamma function (scipy.special.polygamma)."
