    impl: "o[0] = i[2] != 0.0 ? xsf::sph_bessel_k_jac((long)i[0], i[1]) : xsf::sph_bessel_k((long)i[0], i[1]);"
    doc: "Modified spherical Bessel function of the second kind, or its derivative (scipy.special.spherical_kn)."
