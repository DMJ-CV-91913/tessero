    impl: "o[0] = i[2] != 0.0 ? xsf::sph_bessel_y_jac((long)i[0], i[1]) : xsf::sph_bessel_y((long)i[0], i[1]);"
    doc: "Spherical Bessel function of the second kind, or its derivative (scipy.special.spherical_yn)."
  - name: spherical_in
