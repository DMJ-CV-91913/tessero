    impl: "o[0] = i[2] != 0.0 ? xsf::sph_bessel_i_jac((long)i[0], i[1]) : xsf::sph_bessel_i((long)i[0], i[1]);"
    doc: "Modified spherical Bessel function of the first kind, or its derivative (scipy.special.spherical_in)."
  - name: spherical_kn
