# scipy.special functions in the kernel registry (ADR 0011).
# Bootstrapped by tools/parity/bootstrap_special.py from SciPy 1.17.1 wiring; maintained by hand since.
# impl: C++ statement over inputs i[] and outputs o[] (float64). guard: C++ condition under which the outputs are
# NaN instead (inputs that crash or hang SciPy itself, found by tools/parity/crash_scan.py); capped: documents a
# local modification of vendored code that does the same from inside a library (see THIRD_PARTY_NOTICES.md). int_impl: the loop SciPy uses when the
# arguments listed in int_args are integers (NumPy picks it for integer arrays).
module: special
functions:
  - name: agm
    ref: scipy.special.agm
    args: [a, b]
    outs: [y]
    impl: "o[0] = scipy_port::agm(i[0], i[1]);"
    doc: "Compute the arithmetic-geometric mean of `a` and `b`."
  - name: airy
    ref: scipy.special.airy
    args: [z]
    outs: [Ai, Aip, Bi, Bip]
    impl: "xsf::airy(i[0], o[0], o[1], o[2], o[3]);"
    doc: "Airy functions and their derivatives."
  - name: airye
    ref: scipy.special.airye
    args: [z]
    outs: [eAi, eAip, eBi, eBip]
    impl: "xsf::airye(i[0], o[0], o[1], o[2], o[3]);"
    doc: "Exponentially scaled Airy functions and their derivatives."
  - name: bdtr
    ref: scipy.special.bdtr
    args: [k, n, p]
    outs: [y]
    impl: "o[0] = scipy_port::bdtr_unsafe(i[0], i[1], i[2]);"
    int_impl: "o[0] = scipy_xsfw::cephes_bdtr_wrap(i[0], (long)i[1], i[2]);"
    int_args: [1]
    doc: "Binomial distribution cumulative distribution function."
  - name: bdtrc
    ref: scipy.special.bdtrc
    args: [k, n, p]
    outs: [y]
    impl: "o[0] = scipy_port::bdtrc_unsafe(i[0], i[1], i[2]);"
    int_impl: "o[0] = scipy_xsfw::cephes_bdtrc_wrap(i[0], (long)i[1], i[2]);"
    int_args: [1]
    doc: "Binomial distribution survival function."
  - name: bdtri
    ref: scipy.special.bdtri
    args: [k, n, y]
    outs: [p]
    impl: "o[0] = scipy_port::bdtri_unsafe(i[0], i[1], i[2]);"
    int_impl: "o[0] = scipy_xsfw::cephes_bdtri_wrap(i[0], (long)i[1], i[2]);"
    int_args: [1]
    doc: "Inverse function to `bdtr` with respect to `p`."
  - name: bdtrik
    ref: scipy.special.bdtrik
    args: [y, n, p]
    outs: [k]
    impl: "o[0] = scipy_port::bdtrik(i[0], i[1], i[2]);"
    doc: "Inverse function to `bdtr` with respect to `k`."
  - name: bdtrin
    ref: scipy.special.bdtrin
    args: [k, y, p]
    outs: [n]
    impl: "o[0] = scipy_port::bdtrin(i[0], i[1], i[2]);"
    doc: "Inverse function to `bdtr` with respect to `n`."
  - name: bei
    ref: scipy.special.bei
    args: [x]
