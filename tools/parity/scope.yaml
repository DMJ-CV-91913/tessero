# Scope of the NumPy/SciPy parity program: how every census symbol is classified.
#
#   implemented  a Tessero function provides it and a fixture test verifies it on the backend(s) listed:
#                - registry functions: automatically, from spec/*.yaml `ref:` + the fixture results;
#                - functions that predate the registry: the `legacy` map below (test suites named per entry).
#   excluded     one of the fixed categories E1..E7 (prompts/numpy-scipy-parity-program.md section 3.3).
#   planned      everything else, assigned to a phase by `phases` (module default) and `phase_names` (overrides).
#
# Aliases (two names for one object, e.g. numpy.acos / numpy.arccos) inherit the status of their canonical
# name and are not counted in the denominator.

categories:
  E1: object, string, bytes, structured and record dtypes
  E2: numpy.ma masked arrays
  E3: legacy or deprecated API (numpy.matrix, RandomState and the legacy numpy.random functions, deprecated names)
  E4: Python-runtime specifics (testing, printing, error-state and buffer settings, type hierarchy, iteration protocol, DLPack, introspection)
  E5: file formats other than .npy, .npz and text/CSV
  E6: superseded in the reference itself
  E7: interactive, plotting or dataset helpers

exclude:
  - {category: E1, module: numpy, names: [bytes_, str_, object_, void, character, flexible, record, recarray, fromregex, fromstring]}
  - {category: E3, module: numpy, names: [matrix, asmatrix, bmat, row_stack, poly1d, asfarray, mintypecode, common_type, fix]}
  - {category: E4, module: numpy, names: [array2string, array_repr, array_str, base_repr, binary_repr, format_float_positional,
      format_float_scientific, get_printoptions, set_printoptions, printoptions, getbufsize, setbufsize, geterr, seterr,
      geterrcall, seterrcall, errstate, show_config, show_runtime, get_include, info, test, typename, from_dlpack, frompyfunc,
      iterable, isscalar, ndenumerate, ndindex, nditer, nested_iters, flatiter, broadcast, ScalarType, sctypeDict, typecodes,
      generic, number, integer, inexact, floating, complexfloating, signedinteger, unsignedinteger, ufunc, dtype, ndarray,
      little_endian, index_exp, s_, c_, r_, mgrid, ogrid, asanyarray, require, isdtype, issubdtype, min_scalar_type,
      apply_along_axis, apply_over_axes, vectorize]}
  - {category: E3, module: numpy.random, names: '*', except: [Generator, default_rng, SeedSequence, PCG64, BitGenerator]}
  - {category: E4, module: numpy.random, names: [BitGenerator]}
  - {category: E4, module: numpy.ndarray, names: [ctypes, dump, dumps, base, flags, flat, setflags, data, device, to_device, itemsize]}
  - {category: E1, module: numpy.ndarray, names: [getfield, setfield]}
  - {category: E4, module: numpy.random.Generator, names: [bit_generator, spawn]}
  - {category: E4, module: numpy.polynomial, names: [set_default_printstyle]}
  - {category: E4, module: scipy.special, names: [errstate, geterr, seterr, SpecialFunctionError, SpecialFunctionWarning]}
  - {category: E4, module: scipy.stats, names: [ConstantInputWarning, DegenerateDataWarning, FitError, NearConstantInputWarning,
      rv_continuous, rv_discrete, rv_frozen]}
  - {category: E4, module: scipy.optimize, names: [OptimizeWarning, OptimizeResult, show_options, LbfgsInvHessProduct, HessianUpdateStrategy]}
  - {category: E4, module: scipy.linalg, names: [LinAlgError, LinAlgWarning, get_blas_funcs, get_lapack_funcs, find_best_blas_type]}
  - {category: E4, module: scipy.sparse, names: [SparseEfficiencyWarning, SparseWarning, issparse, isspmatrix, sparray, spmatrix,
      isspmatrix_csr, isspmatrix_csc, isspmatrix_coo, isspmatrix_bsr, isspmatrix_dia, isspmatrix_lil, isspmatrix_dok,
      get_index_dtype, safely_cast_index_arrays]}
  - {category: E4, module: scipy.sparse.linalg, names: [ArpackError, ArpackNoConvergence, MatrixRankWarning, test, use_solver]}
  - {category: E4, module: scipy.integrate, names: [IntegrationWarning, ODEintWarning, OdeSolution, OdeSolver, DenseOutput]}
  - {category: E4, module: scipy.signal, names: [BadCoefficients]}
  - {category: E4, module: scipy.fft, names: [set_backend, skip_backend, set_global_backend, register_backend, set_workers, get_workers]}
  - {category: E4, module: scipy.constants, names: [ConstantWarning]}
  - {category: E6, module: scipy.interpolate, names: [interp1d, interp2d, spline, splmake, spleval, spltopp]}
  - {category: E7, module: scipy.cluster.hierarchy, names: [dendrogram, set_link_color_palette]}
  - {category: E7, module: scipy.spatial, names: [delaunay_plot_2d, convex_hull_plot_2d, voronoi_plot_2d]}

phases:
  numpy: 4
  numpy.linalg: 6
  numpy.fft: 6
  numpy.polynomial: 6
  numpy.polynomial.polynomial: 6
  numpy.random: 3
  numpy.random.Generator: 3
  numpy.ndarray: 4
  scipy.special: 1
  scipy.stats: 3
  scipy.linalg: 6
  scipy.fft: 6
  scipy.integrate: 7
  scipy.interpolate: 7
  scipy.signal: 8
  scipy.signal.windows: 8
  scipy.optimize: 9
  scipy.sparse: 10
  scipy.sparse.linalg: 10
  scipy.sparse.csgraph: 10
  scipy.spatial: 10
  scipy.spatial.distance: 10
  scipy.cluster.vq: 10
  scipy.cluster.hierarchy: 10
  scipy.ndimage: 10
  scipy.constants: 11

phase_names:
  2:
    numpy: [median, percentile, quantile, nanmedian, nanpercentile, nanquantile, average, ptp, count_nonzero, nansum, nanprod,
      nanmin, nanmax, nanargmin, nanargmax, nanmean, nanvar, nanstd, nancumsum, nancumprod, histogram, histogram_bin_edges,
      histogram2d, histogramdd, bincount, digitize, cov, corrcoef, correlate, convolve, unique, unique_values, unique_counts,
      unique_inverse, unique_all, isin, intersect1d, union1d, setdiff1d, setxor1d, searchsorted, partition, argpartition,
      lexsort, sort_complex, cumulative_sum, cumulative_prod, amin, amax]
    numpy.ndarray: [partition, argpartition, searchsorted]
  5:
    numpy: [datetime64, timedelta64, datetime_as_string, datetime_data, busday_count, busday_offset, busdaycalendar, is_busday,
      isnat, float16, half, complex64, longdouble, clongdouble, int8, int16, uint16, uint32, uint64, finfo, iinfo, can_cast,
      result_type, promote_types, loadtxt, savetxt, genfromtxt, fromfile, packbits, unpackbits]
    numpy.ndarray: [tofile, byteswap]
  6:
    numpy: [einsum, einsum_path, inner, outer, kron, cross, tensordot, vdot, vecdot, matvec, vecmat, matrix_transpose, trace,
      polyfit, polyval, roots, poly, polyder, polyint, polyadd, polysub, polymul, polydiv, i0, sinc, bartlett, blackman,
      hamming, hanning, kaiser, interp, gradient, trapezoid, unwrap, ediff1d]

