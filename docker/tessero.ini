; Tessero production settings (see docs/operations/configuration-reference.md)

; native backend
tessero.threads = 1
tessero.memory_budget = 256M

; FFI package under FPM: bind libtessero at startup, allow FFI only from preloaded code
ffi.enable = preload
opcache.enable = 1
opcache.preload = /opt/tessero/resources/preload.php
opcache.preload_user = www-data
