; Tessero production settings (see docs/operations/configuration-reference.md)

; native backend
tessero.threads = 1
tessero.memory_budget = 256M

; FFI package under FPM: bind libtessero at startup, allow FFI only from preloaded code
ffi.enable = preload
opcache.enable = 1
opcache.preload = /opt/tessero/resources/preload.php
opcache.preload_user = www-data

; PHP security advisory 2026-10-23 (CVE-2026-115560): disable session upload progress until the next regular
; PHP release fixes it fully. Tessero does not use sessions; this hardens the reference image for applications that do.
session.upload_progress.enabled = 0
